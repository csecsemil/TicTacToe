<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="TTT.css">
</head>
<body>
    <h1>Tic Tac Toe</h1>

    <div>
        <button id="m2" class="active">2 Player (3x3)</button>
        <button id="m3">3 Player (5x5)</button>
        <button id="rst-btn">Reset</button>
    </div>

    <div class="msg" id="status">Player x turn!</div>

    <div class="grid" id="game-board"></div>

    <div class="pop hidden" id="modal">
        <div class="pop-cnt">
            <button id="modal-button">New game!</button>
        </div>
    </div>

    <div id="modal-message"></div>


    <script src="TicTacToe.js"></script>
</body>
</html>
